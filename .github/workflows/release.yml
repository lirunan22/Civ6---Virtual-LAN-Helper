name: Build and release the Mac LAN helper
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "build.py"
      - "release.py"
      - "README.md"
      - "LICENSE*"
      - "THIRD_PARTY.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: civ6-helper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PLUGIN_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: build
        name: Verify publishing and compile the native universal app
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 build.py --test
      - id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        name: Verify and publish Mac downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release.py publish
      - name: Record fixed validation and asset metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_OUTCOME: ${{ job.status }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_PUBLISH: ${{ steps.publish.outcome }}
        run: python3 release.py receipt
